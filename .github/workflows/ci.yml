name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Deterministic tests
        run: python -m pytest tests -m "not live"

  live-gates:
    # Real-model gates run only where secrets are available (not on forks).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: unit
    runs-on: ubuntu-latest
    env:
      LANGSMITH_TRACING: "true"
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      LANGSMITH_TEST_CACHE: .cache/langsmith
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/langsmith
          key: langsmith-test-cache-${{ hashFiles('prompts/**', 'data/**', 'datasets/**') }}
      - run: pip install -e ".[dev]"
      - name: Real-model gates
        run: python -m pytest tests/live -m live
      - name: Regression gate against committed baseline
        if: hashFiles('baselines/qa_baseline.json') != ''
        run: python -m evalsuite.cli seed && python -m evalsuite.cli regression --prompt-version v2
