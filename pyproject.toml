[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langsmith-eval-suite"
version = "0.1.0"
description = "Offline evaluation suite for a documentation-grounded RAG agent, built on LangSmith, LangGraph and openevals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0",
  "langchain-openai",
  "langchain-ollama",
  "langchain-huggingface",
  "langchain-community",
  "langgraph>=1.0",
  "langsmith>=0.4",
  "openevals>=0.1",
  "agentevals>=0.0.9",
  "faiss-cpu",
  "numpy",
  "pydantic-settings",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: deterministic tests with no network access",
  "live: tests that call model providers and log to LangSmith",
]
addopts = "-ra"
